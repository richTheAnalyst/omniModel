[project]
name = "omnimodel"
version = "0.1.0"
description = "Company signal extraction and scoring for the omniModel platform."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
    "python-dotenv>=1.0.0",
    "anthropic>=0.30.0",
    "openai>=1.50.0",
]

[project.optional-dependencies]
scraping = [
    "playwright>=1.40.0",
]
ui = [
    "streamlit>=1.40.0",
    "pandas",
    "pyyaml",
    "reportlab",
    "python-docx",
]
api = [
    "fastapi",
    "uvicorn",
    "pyyaml",
    "reportlab",
    "python-docx",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
omnimodel = "omnimodel.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omnimodel"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]